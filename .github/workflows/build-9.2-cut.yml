name: build-9.2-cut

# Build Rocq at the cut, build the plugin against it and run the suite, through ci/build-9.2-cut.sh.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [typewise-isomorphism-9.2-cut]
  push:
    branches: [typewise-isomorphism-9.2-cut]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # A job id may not hold a '.'; the name is what GitHub shows as the check.
  build_9_2_cut:
    name: build-9.2-cut
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # An opam root is not relocatable: the cached root must come back at the path it was built at, and
      # runner.temp is not stable across runs.
      CUT_ROOT: /home/runner/cut
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0 # the inventory checks read the history

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends m4 rsync pkg-config libgmp-dev unzip

      - name: Read the cut's Rocq commit from the script
        id: cut
        run: |
          sha=$(sed -n 's/^CUT_ROCQ_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' ci/build-9.2-cut.sh)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore the opam root
        id: cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.CUT_ROOT }}
          key: cut-${{ steps.cut.outputs.sha }}-${{ hashFiles('ci/build-9.2-cut.sh') }}

      - name: Build Rocq at the cut, build the plugin, run the suite
        run: ci/build-9.2-cut.sh

      - name: Save the opam root
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.CUT_ROOT }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
